requires = ["tox>=4.19"]
env_list = ["py314", "py313", "py312", "py311", "py310", "py39", "type"]

[env_run_base]
description = "Run test under {base_python}"
deps = ["pytest", "sympy", "gmsh", "pyuff", "deap", "smoot"]
commands = [
    [
        "pip uninstall scidatatool -y",
        "pip install C:\\Users\\ganser\\AppData\\Local\\Programs\\SciDataTool",
        "pytest",
    ],
]
[env.black]
description = "run black linter on code base"
skip_install = true
deps = ["black>=24.0.0,<25.0.0"]
commands = [["black", "pyleecan"]]

