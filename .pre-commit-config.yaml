minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: pyleecan-black
        name: black
        entry: python -m black
        language: system
        files: ^(pyleecan/.*\.py|Tests/.*\.py|tools/.*\.py|setup\.py)$

      - id: pyleecan-forbidden-paths
        name: block ignored packaging and cache artifacts
        entry: python tools/check_repo_policy.py --check forbidden-paths
        language: system
        files: .*

      - id: pyleecan-pytest-markers
        name: block temporary pytest markers
        entry: python tools/check_repo_policy.py --check pytest-markers
        language: system
        files: ^(pyleecan|Tests)/.*\.py$
