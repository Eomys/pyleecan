name: Bug report
description: Report a defect, regression, or incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one short paragraph.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, inputs, and files needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, solver versions, and whether the issue happens in GUI, scripts, or tests.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and affected interfaces
      description: Note whether the bug affects public APIs, serialized files, solver outputs, or GUI workflows.
    validations:
      required: false
