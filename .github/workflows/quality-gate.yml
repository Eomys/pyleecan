name: Quality Gate

on:
  pull_request:
  push:

jobs:
  quality-gate:
    runs-on: windows-latest
    env:
      APPDATA: ${{ github.workspace }}\.tmp_appdata
      LOCALAPPDATA: ${{ github.workspace }}\.tmp_appdata
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      TEMP: ${{ github.workspace }}\.tmp_appdata
      TMP: ${{ github.workspace }}\.tmp_appdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "pre-commit>=4.0.0,<5.0.0" "black>=24.0.0,<25.0.0"

      - name: Determine pre-commit diff range
        id: precommit-range
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $from = "${{ github.event.pull_request.base.sha }}"
          } else {
            $from = "${{ github.event.before }}"
          }

          if ([string]::IsNullOrWhiteSpace($from) -or $from -eq "0000000000000000000000000000000000000000") {
            "from_ref=" >> $env:GITHUB_OUTPUT
            "to_ref=" >> $env:GITHUB_OUTPUT
          } else {
            "from_ref=$from" >> $env:GITHUB_OUTPUT
            "to_ref=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - name: Run pre-commit on changed files
        if: steps.precommit-range.outputs.from_ref != ''
        run: >
          pre-commit run
          --from-ref "${{ steps.precommit-range.outputs.from_ref }}"
          --to-ref "${{ steps.precommit-range.outputs.to_ref }}"
          --show-diff-on-failure

      - name: Run pre-commit on gate files
        if: steps.precommit-range.outputs.from_ref == ''
        run: >
          pre-commit run
          --files
          .pre-commit-config.yaml
          .github/workflows/quality-gate.yml
          setup.py
          tox.toml
          tools/check_repo_policy.py
          --show-diff-on-failure

      - name: Run star test subset
        run: pytest -m star Tests
